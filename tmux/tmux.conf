# go-yolo tmux config (on by default; go-yolo.sh --no-tmux turns it off). Loaded with -f, so ~/.tmux.conf and /etc/tmux.conf
# are not read. $GOYOLO_* come from the entrypoint's environment.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
# The outer terminal is in the alternate screen while tmux runs; without this the wheel
# can't scroll back through agent output. Shift+drag still selects natively.
set -g mouse on

# Nested in a host tmux: use C-a, so C-b still reaches the outer one.
%if "#{!=:$GOYOLO_HOST_TMUX,}"
set -g prefix C-a
unbind C-b
bind C-a send-prefix
%endif

# The tmux client is the container's main process: detaching or suspending it would stop
# the container (and the agent).
unbind d
unbind D
unbind C-z
bind d display-message "go-yolo: detach is disabled (the container stops when tmux exits)"

# Indicator: the status bar and the terminal title say which side of the boundary you're on.
set -g set-titles on
set -g set-titles-string "go-yolo: #W"
set -g status-left-length 60
set -g status-left " go-yolo | $GOYOLO_AGENT | net=$GOYOLO_NET | yolo=$GOYOLO_YOLO_LABEL "
set -g status-right " #H "
set -g status-style "bg=colour24,fg=colour255"
%if "#{==:$GOYOLO_YOLO_LABEL,ON}"
set -g status-style "bg=colour124,fg=colour255"
%endif
set -g window-status-current-style "bold,reverse"
