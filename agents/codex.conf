# shellcheck shell=bash disable=SC2034
# OpenAI Codex CLI — https://developers.openai.com/codex
#
# Codex's own Linux sandbox does not work inside Docker, so it is always turned off
# with --sandbox danger-full-access (the container is the sandbox). Approval prompts
# stay on unless --yolo is given.
AGENT_BIN="codex"
AGENT_ARGS=(--sandbox danger-full-access -c check_for_update_on_startup=false)
AGENT_YOLO_ARGS=(--dangerously-bypass-approvals-and-sandbox)
AGENT_ENV=()
AGENT_YOLO_ENV=()
AGENT_MOUNTS=("$HOME/.codex")
AGENT_DOMAINS=(api.openai.com chatgpt.com auth.openai.com)
