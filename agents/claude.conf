# shellcheck shell=bash disable=SC2034
# Claude Code — https://code.claude.com/docs
#
# AGENT_MOUNTS: host paths mounted read-write at the same path. A missing entry ending
# in .json is created on the host containing {}. Another missing entry whose name
# (ignoring a leading dot) contains a dot is treated as a file and skipped; anything
# else is treated as a directory and created on the host.
AGENT_BIN="claude"
# Auto mode by default; --yolo switches to bypassPermissions (a repeated
# --permission-mode takes the last value, so agent args after these can override both).
AGENT_ARGS=(--permission-mode auto)
AGENT_YOLO_ARGS=(--permission-mode bypassPermissions)
AGENT_ENV=()
AGENT_YOLO_ENV=()
AGENT_MOUNTS=("$HOME/.claude" "$HOME/.claude.json")
# Non-interactive runs, started without tmux so their output stays on stdout.
AGENT_BATCH_ARGS=(-p --print)
AGENT_BATCH_COMMANDS=(mcp doctor plugin setup-token update)
# From https://code.claude.com/docs/en/network-config#network-access-requirements
AGENT_DOMAINS=(api.anthropic.com claude.ai claude.com platform.claude.com
               mcp-proxy.anthropic.com downloads.claude.ai code.claude.com)
