# shellcheck shell=bash disable=SC2034
# opencode — https://opencode.ai/docs
#
# YOLO mode is set through OPENCODE_CONFIG_CONTENT, which opencode merges on top of the
# global and project config (https://opencode.ai/docs/config/). The user's mounted config
# is never modified.
AGENT_BIN="opencode"
AGENT_ARGS=()
AGENT_YOLO_ARGS=()
AGENT_ENV=()
AGENT_YOLO_ENV=('OPENCODE_CONFIG_CONTENT={"permission":"allow"}')
AGENT_MOUNTS=("$HOME/.config/opencode" "$HOME/.local/share/opencode")
# Add the domains of the providers you use (or set GOYOLO_EXTRA_DOMAINS).
AGENT_DOMAINS=(opencode.ai models.dev api.anthropic.com api.openai.com)
